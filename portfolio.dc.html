  </section>

    <sc-for list="{{ visibleProjects }}" as="p" hint-placeholder-count="6">

        <image-slot id="pf-{{ p.id }}" shape="rect" placeholder="{{ p.placeholder }}" style="width:100%;height:100%"></image-slot>
        <img ref="{{ p.imgRef }}" alt="{{ p.title }}" class="ltsuan-pf-img" style="{{ p.realImgStyle }}" loading="lazy" decoding="async" />
        <div style="position:absolute;inset:0;background:rgba(0,0,0,.35);pointer-events:none"></div>

          </div>

            <p style="font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;opacity:.65;margin:8px 0 0;line-height:1.6">{{ p.subtitle }}</p>
          </div>
        </div>
      </a>
    </sc-for>
    </div>
  </section>

  <div style="height:64px"></div>
  <dc-import name="Footer" background="var(--ltsuan-bg)" hint-size="100%,320px"></dc-import>
</div>

  renderVals() {

    const categories = this.categories.map(c => ({
      id: c,
      label: c.toUpperCase(),
      style: `padding:9px 18px;border:1px solid ${filter === c ? 'var(--ltsuan-text)' : 'rgba(244,239,232,.2)'};background:${filter === c ? 'var(--ltsuan-text)' : 'transparent'};color:${filter === c ? 'var(--ltsuan-bg)' : 'rgba(244,239,232,.7)'};font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;font-weight:400;cursor:pointer;min-height:44px;display:inline-flex;align-items:center`,
      active: filter === c ? 'true' : 'false',
    }));
    const list = (filter === 'All Works' ? this.projects : this.projects.filter(p => (p.categories || [p.cat]).includes(filter)))

        ...p,
        area: p.area || '',
        categoryText: (p.categories || [p.cat]).slice().sort((a, b) => (a === 'Construction') - (b === 'Construction')).join(', ').toUpperCase(),

        realImgStyle: p.realImg
          ? 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover'
          : 'display:none',
      }));
    return { categories, visibleProjects: list, setFilter };
